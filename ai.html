<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YamGiftET AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: #0f3d2e;
      padding: 15px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      font-size: 14px;
    }

    nav a:hover {
      background: rgba(255,255,255,0.18);
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero h1 {
      color: #0f3d2e;
      margin-bottom: 8px;
    }

    .hero p {
      color: #666;
    }

    .ai-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    #chatBox {
      min-height: 350px;
      max-height: 550px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
      margin-bottom: 15px;
    }

    #chatBox p {
      margin: 10px 0;
      line-height: 1.6;
    }

    .chat-input {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    #sendBtn {
      border: 0;
      border-radius: 10px;
      padding: 0 22px;
      background: #0f3d2e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendBtn:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 600px) {
      .chat-input {
        flex-direction: column;
      }

      #sendBtn {
        min-height: 48px;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="products.html">📦 Products</a>
    <a href="self-products.html">🛍️ የራሴ ምርቶች</a>
    <a href="orders.html">🧾 Orders</a>
    <a href="customers.html">👥 Customers</a>
    <a href="appointments.html">📅 Appointments</a>
    <a href="notes.html">📝 Notes</a>
    <a href="quote-library.html">💬 Quote Library</a>
    <a href="ai.html">🤖 AI</a>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="contact.html">📞 Contact</a>
  </nav>
</header>

<main>

  <section class="hero">
    <h1>🤖 YamGiftET AI</h1>
    <p>የYamGiftET የAI ረዳት</p>
  </section>

  <section class="ai-card">

    <div id="chatBox">
      <p>
        🤖 <strong>AI:</strong>
        ሰላም! ወደ YamGiftET AI እንኳን በደህና መጡ።
        ምን ልርዳዎት?
      </p>
    </div>

    <div class="chat-input">
      <input
        type="text"
        id="userInput"
        placeholder="ጥያቄዎን ይጻፉ..."
        autocomplete="off"
      >

      <button id="sendBtn">
        ላክ
      </button>
    </div>

  </section>

</main>

<footer>
  © 2026 YamGiftET AI v2
</footer>

<script src="js/ai.js?v=2"></script>

</body>
</html>
