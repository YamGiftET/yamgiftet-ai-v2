<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YamGiftET AI | የቢዝነስ ጤና</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">
  <h2>📊 የቢዝነስ ጤና</h2>
  <p>የYamGiftET AI ንግድ አጠቃላይ የጤና ምርመራ</p>
</header>

<main class="business-health-page">

  <section class="dashboard-module-card">
    <div class="dashboard-module-icon">🩺</div>
    <div class="dashboard-module-content">
      <h3>Business Health Monitor</h3>
      <p id="healthStatus">መረጃ እየተመረመረ ነው...</p>
    </div>
  </section>

  <section class="management-overview">

    <div class="management-item">
      <span>💰</span>
      <strong>ፋይናንስ</strong>
      <small id="healthFinance">-</small>
    </div>

    <div class="management-item">
      <span>📦</span>
      <strong>ትዕዛዞች</strong>
      <small id="healthOrders">-</small>
    </div>

    <div class="management-item">
      <span>🧱</span>
      <strong>ጥሬ እቃ</strong>
      <small id="healthMaterials">-</small>
    </div>

    <div class="management-item">
      <span>🛍️</span>
      <strong>የራስ ምርቶች</strong>
      <small id="healthProducts">-</small>
    </div>

  </section>

  <section class="management-advice">
    <div class="management-advice-title">
      <h3>🧠 የቢዝነስ ጤና ትንተና</h3>
      <p>በንግድ መረጃዎች ላይ የተመሰረተ ግምገማ</p>
    </div>

    <div id="businessHealthAdvice" class="management-advice-list"></div>
  </section>

</main>

<script src="js/ethiopian-calendar.js"></script>
<script src="js/business-health.js"></script>
<script src="js/universal-calculator-ui.js"></script>

<script src="js/auth-guard.js"></script>
</body>
</html>
