<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YamGiftET — ትዕዛዞች</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

     YamGiftET Order Form
===================================== -->

<section id="orders-section" class="orders-section">

    <div class="orders-header">
        <h2>🧾 የትዕዛዝ መመዝገቢያ</h2>
        <p>የደንበኛን እና የትዕዛዝ መረጃ ይመዝግቡ</p>
    </div>

    <form id="orderForm" class="order-form">

        <div class="form-group">
            <label>👤 የደንበኛ ስም</label>
            <input
                type="text"
                id="orderCustomerName"
                required
                placeholder="ሙሉ ስም"
            >
        </div>

        <div class="form-group">
            <label>📞 ስልክ ቁጥር</label>
            <input
                type="tel"
                id="orderPhone"
                required
                placeholder="09xxxxxxxx"
            >
        </div>

        <div class="form-group">
                <label for="orderProductName">🎁 የታዘዘው ምርት</label>
                <input
                    type="text"
                    id="orderProductName"
                    required
                    placeholder="✍️ የምርት ስም ይጻፉ"
                >

                <label for="orderProductId" style="margin-top:12px;">
                    📋 ወይም ከራስ ምርቶች ይምረጡ
                </label>
                <select id="orderProductId">
                    <option value="">-- ከራስ ምርቶች ይምረጡ --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="orderQuantity">🔢 የትዕዛዝ ብዛት</label>
                <input
                    type="number"
                    id="orderQuantity"
                    min="1"
                    step="1"
                    value="1"
                    required
                    placeholder="1"
                >
                <small id="orderQuantityUnit">pcs</small>
            </div>

            <!-- 📐 Area Order Dimensions -->
            <div id="orderAreaSection" class="form-group" style="display:none;">
                <label>📐 የArea ትዕዛዝ መጠን</label>

                <label for="orderLength">↔️ Length</label>
                <input
                    type="number"
                    id="orderLength"
                    min="0"
                    step="0.01"
                    placeholder="Length"
                >

                <label for="orderWidth">↕️ Width</label>
                <input
                    type="number"
                    id="orderWidth"
                    min="0"
                    step="0.01"
                    placeholder="Width"
                >

                <label for="orderDimensionUnit">📏 Length / Width Unit</label>
                <select id="orderDimensionUnit">
                    <option value="cm">cm</option>
                    <option value="mm">mm</option>
                    <option value="m">m</option>
                </select>

                <label for="orderThickness">↕️ Thickness (Optional)</label>
                <input
                    type="number"
                    id="orderThickness"
                    min="0"
                    step="0.01"
                    placeholder="Thickness"
                >

                <label for="orderThicknessUnit">📏 Thickness Unit</label>
                <select id="orderThicknessUnit">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m">m</option>
                </select>

                <label for="orderArea">📐 Calculated Area</label>
                <input
                    type="number"
                    id="orderArea"
                    readonly
                    value="0"
                >
                <small id="orderAreaUnit">m2</small>
            </div>

            <div class="form-group">
            <label>📝 የትዕዛዝ መረጃ</label>
            <textarea
                id="orderInfo"
                placeholder="የደንበኛው ልዩ ፍላጎት..."
            ></textarea>
        </div>


        <div class="form-group">

            <label>📅 የታዘዘበት ቀን 🇪🇹</label>

            <div class="ethiopian-date">

                <select id="orderDateYear"></select>

                <select id="orderDateMonth"></select>

                <select id="orderDateDay"></select>

            </div>

            <small>በኢትዮጵያ አቆጣጠር</small>

        </div>

<div class="form-group">
            <label>💰 የተስማማንበት ዋጋ</label>
                    <!-- 🧮 YamGiftET Universal Calculator -->


<input
                type="number"
                id="orderTotalAmount"
                min="0"
                required
                placeholder="0"
                oninput="calculateOrderAmounts()"
            >
        </div>

        <div class="form-group">
            <label>💵 የተከፈለ ቀብድ</label>
            <input
                type="number"
                id="orderDeposit"
                min="0"
                value="0"
                oninput="calculateOrderAmounts()"
            >
        </div>

        <div class="form-group">
            <label>🪙 ቀሪ ክፍያ</label>
            <input
                type="number"
                id="orderRemaining"
                readonly
                value="0"
            >
        </div>

        <div class="form-group">
            <label>🛠️ የሥራ ወጪ</label>
            <input
                type="number"
                id="orderWorkCost"
                min="0"
                value="0"
                oninput="calculateOrderAmounts()"
            >
        </div>

        <div class="form-group">
            <label>📈 ትርፍ</label>
            <input
                type="number"
                id="orderProfit"
                readonly
                value="0"
            >
        </div>


        <div class="form-group">

            <label>📦 የመውሰጃ ቀን 🇪🇹</label>

            <div class="ethiopian-date">

                <select id="pickupDateYear"></select>

                <select id="pickupDateMonth"></select>

                <select id="pickupDateDay"></select>

            </div>

            <small>በኢትዮጵያ አቆጣጠር</small>

        </div>

        <div class="form-group">
            <label>🚦 የትዕዛዝ ሁኔታ</label>
            <select id="orderStatus">

                <option value="አዲስ">አዲስ</option>

                <option value="በሥራ ላይ">
                    በሥራ ላይ
                </option>

                <option value="ተጠናቋል">
                    ተጠናቋል
                </option>

                <option value="ተሰጥቷል">
                    ተሰጥቷል
                </option>

                <option value="ተሰርዟል">
                    ተሰርዟል
                </option>

            </select>
        </div>

        <div class="form-group">
            <label>📝 ማስታወሻ</label>

            <textarea
                id="orderNotes"
                placeholder="ተጨማሪ መረጃ..."
            ></textarea>

        </div>

        <div class="form-group">
            <label>📸 የደንበኛ ፎቶ / የትዕዛዝ ፎቶ</label>
            <input
                type="file"
                id="orderPhoto"
                accept="image/*"
            >
            <small>ፎቶ ከGallery ይምረጡ</small>
            <img
                id="orderPhotoPreview"
                alt="የፎቶ Preview"
                style="display:none; max-width:100%; margin-top:10px; border-radius:10px;"
            >
        </div>

        <button
            type="submit"
            class="order-submit"
        >
            💾 ትዕዛዙን አስቀምጥ
        </button>

    </form>

<section id="universalCalculator" class="universal-calculator-section">
          <div class="universal-calculator">

            <div class="calculator-header">
              <span>🧮</span>
              <div>
                <h2>🧮 ሁለንተናዊ ካልኩሌተር</h2>
                <p>የንግድ ፈጣን ስሌት ማዕከል</p>
              </div>
            </div>

            <input
              id="universalCalculatorDisplay"
              class="calculator-display"
              type="text"
              value="0"
              readonly
              aria-label="የካልኩሌተር ውጤት"
            >

            <div class="calculator-buttons">

              <button type="button" data-calculator-clear>C</button>
              <button type="button" data-calculator-backspace>⌫</button>
              <button type="button" data-calculator-operation="%">%</button>
              <button type="button" data-calculator-operation="/">÷</button>

              <button type="button" data-calculator-number="7">7</button>
              <button type="button" data-calculator-number="8">8</button>
              <button type="button" data-calculator-number="9">9</button>
              <button type="button" data-calculator-operation="*">×</button>

              <button type="button" data-calculator-number="4">4</button>
              <button type="button" data-calculator-number="5">5</button>
              <button type="button" data-calculator-number="6">6</button>
              <button type="button" data-calculator-operation="-">−</button>

              <button type="button" data-calculator-number="1">1</button>
              <button type="button" data-calculator-number="2">2</button>
              <button type="button" data-calculator-number="3">3</button>
              <button type="button" data-calculator-operation="+">+</button>

              <button
                type="button"
                class="calculator-zero"
                data-calculator-number="0"
              >0</button>

              <button type="button" data-calculator-number=".">.</button>

              <button
                type="button"
                class="calculator-equals"
                data-calculator-equals
              >=</button>

            </div>
          </div>
        </section>

<div class="order-calculator-integration">
            <p>🧮 የCalculator ውጤት ወደ Order ላክ</p>

            <div class="order-calculator-actions">
                <button type="button" data-order-calculator-target="total">
                    💰 ወደ ጠቅላላ ዋጋ
                </button>

                <button type="button" data-order-calculator-target="deposit">
                    💵 ወደ ቀብድ
                </button>

                <button type="button" data-order-calculator-target="workCost">
                    🛠️ ወደ የሥራ ወጪ
                </button>
            </div>
        </div>


</section>


<script src="js/ethiopian-calendar.js"></script>
<script src="js/orders.js"></script>

<script src="js/universal-calculator-ui.js"></script>
<script src="js/cost-profit-browser.js"></script>
<script src="js/cost-profit-ui.js"></script>
<script src="js/cost-profit-orders-integration.js"></script>
<script src="js/orders-calculator-integration.js"></script>
<script src="js/auth-guard.js"></script>
</body>
</html>
