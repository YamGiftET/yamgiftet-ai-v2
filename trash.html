<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yam Gift | Universal Trash</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Ethiopic", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: min(1100px, 94%);
      margin: 25px auto;
    }

    .header {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      border: 2px solid #8b1e1e;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      color: #8b1e1e;
      font-size: 24px;
    }

    .subtitle {
      margin: 7px 0 0;
      opacity: .7;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .refresh {
      background: #0d6efd;
      color: #fff;
    }

    .empty {
      background: #b00020;
      color: #fff;
    }

    .back {
      background: #555;
      color: #fff;
    }

    #status {
      margin: 15px 0;
      text-align: center;
      font-weight: 700;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.05);
    }

    .card-info strong {
      display: block;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .card-info small {
      display: block;
      margin-top: 4px;
      opacity: .75;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .restore {
      background: #198754;
      color: #fff;
    }

    .permanent {
      background: #b00020;
      color: #fff;
    }

    .empty-state {
      background: #fff;
      border-radius: 14px;
      padding: 35px 15px;
      text-align: center;
      border: 1px solid #ddd;
    }

    @media (max-width: 650px) {
      .actions,
      .actions button {
        width: 100%;
      }

      .card-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="header">
      <div class="header-top">
        <div>
          <h1>🗑️ Universal Trash</h1>
          <p class="subtitle">ሁሉም የተሰረዙ መረጃዎች</p>
        </div>

        <div class="actions">
          <button class="refresh" id="refreshBtn">🔄 Refresh</button>
          <button class="empty" id="emptyBtn">🧹 Empty Trash</button>
          <button class="back" onclick="history.back()">↩️ ተመለስ</button>
        </div>
      </div>
    </section>

    <div id="status"></div>
    <section id="trashBody"></section>

  </main>

  <script>
    "use strict";

    const body = document.getElementById("trashBody");
    const status = document.getElementById("status");

    function escapeHTML(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    function formatDate(value) {
      if (!value) return "-";

      try {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return escapeHTML(value);
        return date.toLocaleString();
      } catch {
        return escapeHTML(value);
      }
    }

    function displayName(item) {
      return (
        item.displayName ||
        item.customerName ||
        item.name ||
        item.title ||
        item.productName ||
        item.id ||
        "-"
      );
    }

    async function loadTrash() {
      status.textContent = "🗑️ Universal Trash እየተጫነ ነው...";
      body.innerHTML = "";

      try {
        const response = await fetch("/api/universal-trash", {
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "Universal Trash መጫን አልተቻለም።"
          );
        }

        const items = Array.isArray(data.items) ? data.items : [];

        if (!items.length) {
          status.textContent = "";
          body.innerHTML =
            '<div class="empty-state">♻️ Universal Trash ባዶ ነው።</div>';
          return;
        }

        status.textContent =
          "🗑️ በTrash ውስጥ ያሉ መረጃዎች: " + items.length;

        body.innerHTML = items.map(item => {
          const id = escapeHTML(item.id || "");
          const name = escapeHTML(displayName(item));
          const type = escapeHTML(item.trashType || "-");
          const collection = escapeHTML(item.sourceCollection || "-");
          const originalId = escapeHTML(item.originalId || "-");
          const deletedAt = formatDate(item.deletedAt);

          return `
            <article class="card">
              <div class="card-info">
                <strong>👤 ${name}</strong>
                <small>🏷️ አይነት: ${type}</small>
                <small>📁 Collection: ${collection}</small>
                <small>🆔 Original ID: ${originalId}</small>
                <small>🕒 የተሰረዘበት: ${deletedAt}</small>
              </div>

              <div class="card-actions">
                <button
                  class="restore"
                  data-id="${id}">
                  ♻️ Restore
                </button>

                <button
                  class="permanent"
                  data-id="${id}">
                  🗑️ Permanently Delete
                </button>
              </div>
            </article>
          `;
        }).join("");

        document.querySelectorAll(".restore").forEach(button => {
          button.addEventListener("click", () => {
            restoreTrash(button.dataset.id);
          });
        });

        document.querySelectorAll(".permanent").forEach(button => {
          button.addEventListener("click", () => {
            permanentDelete(button.dataset.id);
          });
        });

      } catch (error) {
        console.error("Universal Trash Load Error:", error);
        status.textContent = "";
        body.innerHTML =
          '<div class="empty-state">❌ Universal Trash መጫን አልተቻለም።<br><br>' +
          escapeHTML(error.message || error) +
          '</div>';
      }
    }

    async function restoreTrash(id) {
      if (!id) return;

      if (!confirm(
        "♻️ ይህን መረጃ Restore ማድረግ ይፈልጋሉ?\n\n" +
        "መረጃው ወደ ዋናው collection ይመለሳል።"
      )) return;

      try {
        const response = await fetch(
          "/api/universal-trash/" +
          encodeURIComponent(id) +
          "/restore",
          {
            method: "POST",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Restore ማድረግ አልተቻለም።"
          );
        }

        alert("♻️ መረጃው በትክክል Restore ተደርጓል።");
        await loadTrash();

      } catch (error) {
        console.error("Universal Trash Restore Error:", error);
        alert(
          "❌ Restore ማድረግ አልተቻለም።\n\n" +
          (error.message || error)
        );
      }
    }

    async function permanentDelete(id) {
      if (!id) return;

      if (!confirm(
        "⚠️ በጣም ጠንቃቃ!\n\n" +
        "🗑️ ይህን መረጃ Permanently Delete ካደረጉት\n" +
        "ሙሉ በሙሉ ይጠፋል።\n\n" +
        "♻️ Restore ማድረግ አይቻልም።\n\n" +
        "እርግጠኛ ነዎት?"
      )) return;

      try {
        const response = await fetch(
          "/api/universal-trash/" +
          encodeURIComponent(id) +
          "/permanent",
          {
            method: "DELETE",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Permanent Delete አልተሳካም።"
          );
        }

        alert("🗑️ መረጃው በቋሚነት ተሰርዟል።");
        await loadTrash();

      } catch (error) {
        console.error("Permanent Delete Error:", error);
        alert(
          "❌ Permanently Delete ማድረግ አልተቻለም።\n\n" +
          (error.message || error)
        );
      }
    }

    async function emptyTrash() {
      if (!confirm(
        "⚠️ በጣም ጠንቃቃ!\n\n" +
        "🧹 Universal Trash ውስጥ ያሉ ሁሉም መረጃዎች\n" +
        "በቋሚነት ይሰረዛሉ።\n\n" +
        "♻️ Restore ማድረግ አይቻልም።\n\n" +
        "ሁሉንም መሰረዝ ይፈልጋሉ?"
      )) return;

      try {
        const response = await fetch("/api/universal-trash", {
          method: "DELETE",
          headers: {
            "Accept": "application/json"
          }
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Empty Trash አልተሳካም።"
          );
        }

        alert(
          "🧹 Universal Trash በትክክል ተጠርጓል።\n\n" +
          "የተሰረዙ መረጃዎች: " +
          String(result.deletedCount || 0)
        );

        await loadTrash();

      } catch (error) {
        console.error("Universal Trash Clear Error:", error);
        alert(
          "❌ Universal Trash መጥረግ አልተቻለም።\n\n" +
          (error.message || error)
        );
      }
    }

    document
      .getElementById("refreshBtn")
      .addEventListener("click", loadTrash);

    document
      .getElementById("emptyBtn")
      .addEventListener("click", emptyTrash);

    loadTrash();
  </script>
</body>
</html>
