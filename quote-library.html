<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YamGiftET AI — Quote Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="quoteLibrarySection" class="quote-library-section">

    <div class="quote-library-header">
        <div>
            <span class="quote-library-kicker">💬 YamGiftET AI</span>
            <h2>📚 የጥቅስ ላይብረሪ</h2>
            <p>የተፈቀዱ ምርጥ እና ለስጦታ የሚመቹ የአማርኛ ጥቅሶች</p>
        </div>

        <div class="quote-library-generator-options">
    <label>
        የጥቅስ ምንጭ
        <select id="quoteSource">
            <option value="user">✍️ እኔ የምጽፈውን ተጠቀም</option>
            <option value="ai">🤖 AI እንዲመርጥ ፍቀድ</option>
        </select>
    </label>

    <label id="aiQuoteCategoryLabel" style="display:none;">
        የAI ጥቅስ ምድብ
        <select id="quoteCategory">
            <option value="Love">❤️ ፍቅር</option>
            <option value="Birthday">🎂 ልደት</option>
            <option value="Gift">🎁 ስጦታ</option>
            <option value="Thanks">🙏 ምስጋና</option>
            <option value="Family">👨‍👩‍👧 ቤተሰብ</option>
            <option value="Friendship">🤝 ወዳጅነት</option>
            <option value="Memories">🕊️ ትዝታ</option>
            <option value="Happiness">😊 ደስታ</option>
            <option value="Bible">📖 መጽሐፍ ቅዱስ</option>
            <option value="Spiritual">✨ መንፈሳዊ</option>
        </select>
    </label>

    <label id="customQuoteCategoryLabel">
        የራስዎ ምድብ
        <input
            id="customQuoteCategory"
            type="text"
            placeholder="ለምሳሌ፦ እናት ፍቅር"
            maxlength="60"
        >
    </label>

    <label>
        ብዛት
        <select id="quoteCount">
            <option value="10">10 ጥቅሶች</option>
            <option value="15">15 ጥቅሶች</option>
            <option value="20">20 ጥቅሶች</option>
        </select>
    </label>
</div>

<button id="generateQuoteButton" type="button"
                onclick="quoteLibrary.generate()">
            ✨ አዲስ ምርጥ ጥቅስ
        </button>
    </div>

    <div class="quote-library-stats">

        <div class="quote-library-stat">
            <span>📚</span>
            <strong id="quoteLibraryTotal">0</strong>
            <small>ጠቅላላ ጥቅሶች</small>
        </div>

        <div class="quote-library-stat">
            <span>📅</span>
            <strong id="quoteLibraryToday">0</strong>
            <small>የዛሬ ጥቅሶች</small>
        </div>

        <div class="quote-library-stat">
            <span>⭐</span>
            <strong id="quoteLibraryFavorites">0</strong>
            <small>Favorites</small>
        </div>

        <div class="quote-library-stat">
            <span>🎁</span>
            <strong id="quoteLibraryUsed">0</strong>
            <small>ተጠቀምኩበት</small>
        </div>

        <div class="quote-library-stat">
            <span>🔢</span>
            <strong id="quoteLibraryTotalUsage">0</strong>
            <small>ጠቅላላ አጠቃቀም</small>
        </div>

        <div class="quote-library-stat">
            <span>🗑️</span>
            <strong id="quoteLibraryTrash">0</strong>
            <small>Trash</small>
        </div>

        <div class="quote-library-stat">
            <span>⭐</span>
            <strong id="quoteLibraryBestScore">—</strong>
            <small>ከፍተኛ ውጤት</small>
        </div>

    </div>

    <div id="quoteLibraryTabs" class="quote-library-tabs">
            <button type="button" class="quote-library-tab active" data-tab="all">
                📚 ሁሉም
            </button>
            <button type="button" class="quote-library-tab" data-tab="favorites">
                ⭐ Favorites
            </button>
            <button type="button" class="quote-library-tab" data-tab="used">
                🎁 ተጠቀምኩበት
            </button>
            <button type="button" class="quote-library-tab" data-tab="trash">
                🗑️ Trash
            </button>
        </div>

<div id="quoteLibraryList" class="quote-library-list">
        <div class="quote-library-empty">
            ⏳ ጥቅሶች እየተጫኑ ነው...
        </div>
    </div>

</section>

<script src="js/quote-library.js"></script>

<script src="js/auth-guard.js"></script>
</body>
</html>
