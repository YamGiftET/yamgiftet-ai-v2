<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YamGiftET AI | Universal Finance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">
  <h2>💰 Universal Finance</h2>
  <p>የYamGiftET AI የፋይናንስ ቁጥጥርና ማጠቃለያ</p>
</header>

<main>

  <section class="dashboard-management-center">

    <div class="management-header">
      <div>
        <span class="management-kicker">💰 FINANCE CENTER</span>
        <h2>የፋይናንስ ማዕከል</h2>
        <p>ሽያጭ፣ ክፍያ፣ ወጪ፣ ትርፍ እና Cash Flow በአንድ ቦታ</p>
      </div>

      <button id="financeRefresh" type="button">
        🔄 አድስ
      </button>
    </div>

        <div id="financeCalculationAlarm" class="finance-calculation-alarm"></div>
    <div id="financeCards" class="yam-re-financial-cards">
      ⏳ የፋይናንስ መረጃ እየተጫነ ነው...
    </div>

    <section id="universalCalculator" class="universal-calculator-section">
      <div class="universal-calculator">

        <div class="calculator-header">
          <span>🧮</span>
          <div>
            <h2>Universal Calculator</h2>
            <p>የንግድ ፈጣን ስሌት ማዕከል</p>
          </div>
        </div>

        <input
          id="universalCalculatorDisplay"
          class="calculator-display"
          type="text"
          value="0"
          readonly
          aria-label="የCalculator ውጤት"
        >

        <div class="calculator-buttons">

          <button type="button" data-calculator-clear>C</button>
          <button type="button" data-calculator-backspace>⌫</button>
          <button type="button" data-calculator-operation="%">%</button>
          <button type="button" data-calculator-operation="/">÷</button>

          <button type="button" data-calculator-number="7">7</button>
          <button type="button" data-calculator-number="8">8</button>
          <button type="button" data-calculator-number="9">9</button>
          <button type="button" data-calculator-operation="*">×</button>

          <button type="button" data-calculator-number="4">4</button>
          <button type="button" data-calculator-number="5">5</button>
          <button type="button" data-calculator-number="6">6</button>
          <button type="button" data-calculator-operation="-">−</button>

          <button type="button" data-calculator-number="1">1</button>
          <button type="button" data-calculator-number="2">2</button>
          <button type="button" data-calculator-number="3">3</button>
          <button type="button" data-calculator-operation="+">+</button>

          <button
            type="button"
            class="calculator-zero"
            data-calculator-number="0"
          >0</button>

          <button type="button" data-calculator-number=".">.</button>

          <button
            type="button"
            class="calculator-equals"
            data-calculator-equals
          >=</button>

        </div>
      </div>
    </section>

    <div class="yam-re-tab-panel active">

      <div class="yam-re-panel-header">
        <div>
          <h3>📜 Finance History</h3>
          <p>የሽያጭና የወጪ የፋይናንስ ታሪክ</p>
        </div>
      </div>

      
    <div id="financeSources" class="yam-re-finance-sources"></div>

    <div id="financeHistory" class="yam-re-finance-history-section">
        ⏳ ታሪክ እየተጫነ ነው...
      </div>

    </div>

  </section>

</main>

<script src="js/finance-dashboard.js"></script>
<script src="js/universal-calculator-ui.js"></script>

<script src="js/auth-guard.js"></script>
</body>
</html>
