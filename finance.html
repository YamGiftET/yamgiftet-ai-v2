<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YamGiftET AI | Universal Finance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">
  <h2>💰 Universal Finance</h2>
  <p>የYamGiftET AI የፋይናንስ ቁጥጥርና ማጠቃለያ</p>
</header>

<main>

  <section class="dashboard-management-center">

    <div class="management-header">
      <div>
        <span class="management-kicker">💰 FINANCE CENTER</span>
        <h2>የፋይናንስ ማዕከል</h2>
        <p>ሽያጭ፣ ክፍያ፣ ወጪ፣ ትርፍ እና Cash Flow በአንድ ቦታ</p>
      </div>

      <button id="financeRefresh" type="button">
        🔄 አድስ
      </button>
    </div>

        <div id="financeCalculationAlarm" class="finance-calculation-alarm"></div>
    <div id="financeCards" class="yam-re-financial-cards">
      ⏳ የፋይናንስ መረጃ እየተጫነ ነው...
    </div>

    <div class="yam-re-tab-panel active">

      <div class="yam-re-panel-header">
        <div>
          <h3>📜 Finance History</h3>
          <p>የሽያጭና የወጪ የፋይናንስ ታሪክ</p>
        </div>
      </div>

      
    <div id="financeSources" class="yam-re-finance-sources"></div>

    <div id="financeHistory" class="yam-re-finance-history-section">
        ⏳ ታሪክ እየተጫነ ነው...
      </div>

    </div>

  </section>

</main>

<script src="js/finance-dashboard.js"></script>

<script src="js/auth-guard.js"></script>
</body>
</html>
